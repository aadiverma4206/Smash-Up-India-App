version: '3.8'

services:
  backend:
    build: .
    container_name: smash_up_india_backend
    restart: always
    ports:
      - "8599:8599"
    environment:
      - PORT=8599
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:system@postgres:5432/smash_up_india
      - JWT_SECRET=supersecret_smash_up_india_access_key_2026
      - JWT_REFRESH_SECRET=supersecret_smash_up_india_refresh_key_2026
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    container_name: smash_up_india_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: system
      POSTGRES_DB: smash_up_india
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: smash_up_india_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_access_key
      MINIO_ROOT_PASSWORD: minio_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
