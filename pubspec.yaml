name: smash_up_india
description: "Smash Up India - Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.8.0+1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  dio_cache_interceptor: ^3.5.0
  cached_network_image: ^3.4.1
  razorpay_flutter: ^1.3.7
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  device_info_plus: ^11.2.1
  connectivity_plus: ^6.1.1
  form_validator: ^2.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.16
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.19.0
  logger: ^2.5.0
  flutter_dotenv: ^5.2.1
  internet_connection_checker_plus: ^2.5.2
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  image_picker: ^1.1.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^20.1.0
  socket_io_client: ^3.0.2
  video_player: ^2.9.2
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.8
  open_filex: ^5.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: any
  json_serializable: any
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/App_Logo/smash_up_india.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/images/App_Logo/
    - assets/images/deploy/
    - assets/images/Refer/
    - assets/images/No_data/
    - assets/images/Home_page/
    - assets/images/find_Games/
    - assets/images/Login/
    - assets/images/Register/
    - assets/images/Slider/
    - assets/images/Slider/Home_page/
    - assets/images/Slider/find_Games/
    - assets/images/Slider/Register/
    - assets/images/find_Games/
    - assets/images/Login/
    - assets/images/Register/
    - assets/images/Slider/
    - assets/images/Slider/Home_page/
    - assets/images/Slider/find_Games/
    - assets/images/Slider/Register/
